name: Build Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Brahma Connect APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brahma-connect-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brahma-connect-debug-apk
          path: brahma-connect-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
